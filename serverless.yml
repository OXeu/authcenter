app: authcenter
component: scf
name: authcenter
stage: production
inputs:
  name: authcenter
  src: ./.tmp/scf
  type: web
  runtime: Go1
  region: ${env:SCF_REGION}
  memorySize: 64
  timeout: 30
  initTimeout: 60
  publicAccess: true
  vpcConfig:
    vpcId: ${env:SCF_VPC_ID}
    subnetId: ${env:SCF_SUBNET_ID}
  environment:
    variables:
      AC_ADDR: '0.0.0.0:9000'
      AC_DB_DRIVER: mysql
      AC_ENV: production
      AC_ENV_FILE: /var/user/.env.local
  events:
    - http:
        parameters:
          netConfig:
            enableIntranet: true
            enableExtranet: true
          qualifier: $DEFAULT
          authType: NONE

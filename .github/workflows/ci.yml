name: CI and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: authcenter-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: authcenter
        ports:
          - 23306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Go linter
        run: |
          mkdir -p .tmp
          TMPDIR="$PWD/.tmp" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - run: make check
      - run: TMPDIR="$PWD/.tmp" go test -tags=mysql ./internal/server -run TestMySQLStore -count=1
      - run: make build
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.SCF_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      STAGE: production
      SERVERLESS_PLATFORM_VENDOR: tencent
      SCF_REGION: ${{ vars.SCF_REGION }}
      SCF_VPC_ID: ${{ vars.SCF_VPC_ID }}
      SCF_SUBNET_ID: ${{ vars.SCF_SUBNET_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Deploy Tencent SCF
        env:
          SCF_RUNTIME_ENV: ${{ secrets.SCF_RUNTIME_ENV }}
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: npm run deploy:scf
      - name: Verify deployed service
        env:
          SCF_PUBLIC_URL: ${{ vars.SCF_PUBLIC_URL }}
        run: npm run verify:scf

name: CI and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: authcenter-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: authcenter
        ports:
          - 23306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned common infrastructure
        env:
          COMMON_REPO_TOKEN: ${{ secrets.COMMON_REPO_TOKEN }}
          COMMON_REPO_SSH_KEY: ${{ secrets.COMMON_REPO_SSH_KEY }}
        run: node tools/common.ts --locked
      - uses: ./.tmp/common/.github/actions/check

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.SCF_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      STAGE: production
      SERVERLESS_PLATFORM_VENDOR: tencent
      SCF_REGION: ${{ vars.SCF_REGION }}
      SCF_VPC_ID: ${{ vars.SCF_VPC_ID }}
      SCF_SUBNET_ID: ${{ vars.SCF_SUBNET_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned common infrastructure
        env:
          COMMON_REPO_TOKEN: ${{ secrets.COMMON_REPO_TOKEN }}
          COMMON_REPO_SSH_KEY: ${{ secrets.COMMON_REPO_SSH_KEY }}
        run: node tools/common.ts --locked
      - uses: ./.tmp/common/.github/actions/setup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deploy Tencent SCF
        env:
          SCF_RUNTIME_ENV: ${{ secrets.SCF_RUNTIME_ENV }}
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: npm run deploy:scf
      - name: Verify deployed service
        env:
          SCF_PUBLIC_URL: ${{ vars.SCF_PUBLIC_URL }}
        run: npm run verify:scf
